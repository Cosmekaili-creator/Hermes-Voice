# Example nginx vhost for Hermes Voice.
# Replace voice.example.com and certificate paths before use.
# Realtime audio WebSocket is browser → xAI (not through this proxy).

upstream hermes_voice_node {
    server 127.0.0.1:4331;
    keepalive 8;
}

# Optional: log format without query strings so ?k= never hits disk.
# Place in http{} (e.g. conf.d/) if you use access_log … hermes_voice_safe;
# log_format hermes_voice_safe '$remote_addr - $remote_user [$time_local] '
#   '"$request_method $uri $server_protocol" $status $body_bytes_sent '
#   '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name voice.example.com;
    access_log off;
    return 301 https://voice.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name voice.example.com;

    ssl_certificate     /etc/letsencrypt/live/voice.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 256k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Required: allow microphone for this vhost
    add_header Permissions-Policy "microphone=(self)" always;

    # Prefer a query-safe access log format (see comment above)
    # access_log /var/log/nginx/hermes-voice.access.log hermes_voice_safe;

    location / {
        proxy_pass         http://hermes_voice_node;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie $http_cookie;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $http_connection;

        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    location ~ /\. {
        deny all;
    }
}
